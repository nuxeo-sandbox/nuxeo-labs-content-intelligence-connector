<!--
`cic-kd-ask-question`
@group Nuxeo UI
@element cic-kd-ask-question

Ask a question to Knowledge Discovery.
-->
<link rel="import" href="cic-kd-ask-question-shared.html">
<dom-module id="cic-kd-ask-question">
  <template>
    <style include="nuxeo-action-button-styles nuxeo-styles"></style>

    <cic-kd-ask-question-shared
      icon="[[icon]]"
      label="[[label]]"
      show-label="[[showLabel]]">
    </cic-kd-ask-question-shared>

  </template>

  <script>
    Polymer({
      is: 'cic-kd-ask-question',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {
        label: {
          type: String,
          value: 'label.ui.cic.kd-ask.askKD'
        },

        showLabel: {
          type: Boolean,
          value: false,
        },

        icon: {
          type: String,
          value: 'icons:speaker-notes',
          reflectToAttribute: true
        },
      }
    });
  </script>
</dom-module>
